<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="John Swaroop's résumé." />
    <title>Résumé — John Swaroop</title>
    <style>
      :root {
        color: #171815;
        background: #f1eee5;
        font-family: Inter, "Helvetica Neue", Arial, sans-serif;
        font-synthesis: none;
      }

      * { box-sizing: border-box; }
      html, body { height: 100%; }
      body { margin: 0; display: grid; grid-template-rows: 68px 1fr; }
      a { color: inherit; text-decoration: none; }

      header {
        width: min(100% - 48px, 1440px);
        margin: 0 auto;
        display: flex;
        align-items: center;
        justify-content: space-between;
        border-bottom: 1px solid rgba(23, 24, 21, .18);
      }

      .back, .download { display: inline-flex; align-items: center; gap: 10px; font-size: 12px; }
      .download { min-height: 38px; padding: 0 15px; border-radius: 100px; color: white; background: #171815; }
      main { min-height: 0; padding: 16px 24px 24px; }
      iframe { width: 100%; height: 100%; display: block; border: 1px solid rgba(23, 24, 21, .18); background: white; }

      @media (max-width: 600px) {
        body { grid-template-rows: 60px 1fr; }
        header { width: calc(100% - 32px); }
        main { padding: 10px 10px 14px; }
      }
    </style>
  </head>
  <body>
    <header>
      <a class="back" href="/">← Back to portfolio</a>
      <a class="download" href="/resume/John-Swaroop-Resume.pdf" download>Download PDF <span>↓</span></a>
    </header>
    <main>
      <iframe src="/resume/John-Swaroop-Resume.pdf#view=FitH" title="John Swaroop résumé PDF">
        <p>Your browser cannot display this PDF. <a href="/resume/John-Swaroop-Resume.pdf">Open the résumé</a>.</p>
      </iframe>
    </main>
  </body>
</html>
